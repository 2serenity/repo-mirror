name: Self-test

# The GitHub packaging had no check of its own, and that is exactly how a
# reusable workflow that GitHub could not parse shipped and sat through six
# pushes: the file stayed valid YAML, so nothing complained. The GitLab side
# has compiled the component on every commit from the start (see the
# self-include in .gitlab-ci.yml); this is its counterpart.
#
# It runs the packaged artefact - the composite action, not mirror.sh directly
# - because the packaging is the part that keeps breaking. The peer is a local
# bare repository over file://, so the test needs no key, no secret and no
# network, and it asserts success rather than a particular failure. SSH
# transport is covered on the GitLab side by a real run.

# No pull_request trigger on purpose: GitHub checks out a merge commit there,
# so HEAD is not the tip of the branch being mirrored and the assertion below
# would compare the wrong things. Merge requests are gated on the GitLab side.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  action-mirrors-to-a-local-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build a peer that is one commit behind
        run: |
          set -eu
          git clone --bare . "$RUNNER_TEMP/peer.git"
          git -C "$RUNNER_TEMP/peer.git" update-ref refs/heads/main HEAD~1
          echo "peer at $(git -C "$RUNNER_TEMP/peer.git" rev-parse main)"
          echo "here at $(git rev-parse HEAD)"

      - name: Mirror to it with the action
        uses: ./
        with:
          branch: main
          peer-url: file://${{ runner.temp }}/peer.git
          # file:// never opens an SSH connection; the action still writes these
          # out, so they must be present but need not be usable.
          ssh-key: "not-a-key"
          known-hosts: "not-a-host"

      - name: Assert the peer actually moved
        run: |
          set -eu
          peer=$(git -C "$RUNNER_TEMP/peer.git" rev-parse main)
          here=$(git rev-parse HEAD)
          echo "peer=$peer"
          echo "here=$here"
          test "$peer" = "$here"

      - name: Assert a second run is a no-op
        uses: ./
        with:
          branch: main
          peer-url: file://${{ runner.temp }}/peer.git
          ssh-key: "not-a-key"
          known-hosts: "not-a-host"

  # The job above proves the action at HEAD works. It does not prove the part a
  # consumer actually touches: `uses: <owner>/<repo>/.github/workflows/...@<tag>`.
  # That path was documentation-only until now - no caller had ever resolved it,
  # which is how a workflow GitHub could not even parse sat unnoticed.
  #
  # This calls the reusable workflow the way a consumer does, by full path at
  # the released tag, so it exercises tag resolution, the typed workflow_call
  # inputs, secret mapping by name, and the download of 2serenity/repo-mirror@v1
  # pinned inside it. It tests the TAG, not HEAD - which is the point: it fails
  # when the reference consumers actually use is broken.
  #
  # The peer is this repository over HTTPS, so the run needs no key and no
  # reachable private host: classify() sees the same commit on both sides and
  # exits EQUAL before any push. What it therefore does not cover is the SSH
  # transport (covered by a real run on the GitLab side) and the access rules
  # between two *different* repositories, which a public callee does not have.
  released-workflow-resolves-for-a-consumer:
    uses: 2serenity/repo-mirror/.github/workflows/mirror.yml@v1
    with:
      branch: main
      peer-url: https://github.com/2serenity/repo-mirror.git
    secrets:
      # Never used: an HTTPS peer opens no SSH connection, and EQUAL returns
      # before the push step.
      ssh-key: "not-a-key"
      known-hosts: "not-a-host"
