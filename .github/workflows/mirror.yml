name: Mirror repository

# Reusable workflow: one-directional fast-forward-only mirror of a branch to a
# peer over SSH. Intended to be called from a consumer repository, e.g.
#
#   jobs:
#     mirror:
#       uses: 2serenity/repo-mirror/.github/workflows/mirror.yml@v1
#       with:
#         branch: dev
#         peer-url: ssh://git@gitlab.example.com:2222/group/project.git
#       secrets:
#         ssh-key: ${{ secrets.MIRROR_SSH_KEY }}
#         known-hosts: ${{ secrets.MIRROR_KNOWN_HOSTS }}
#
# mirror.sh is symmetric and can run from either side. While only one side is
# active, this has an important consequence: if anyone pushes directly to the
# peer branch, mirror.sh sees PEER_AHEAD, exits successfully and does nothing —
# changes from this side would silently stop arriving. The receiving branch on
# the peer MUST therefore be protected and writable only by this mirror's key.

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to mirror."
        required: true
      peer-url:
        description: "SSH URL of the peer repository."
        required: true
    secrets:
      ssh-key:
        description: "Private SSH key (deploy key)."
        required: true
      known-hosts:
        description: "known_hosts entry for the peer host."
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Two mirror runs must not race.
    concurrency:
      group: repository-mirror
      cancel-in-progress: false

    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # mirror.sh compares full branches; a shallow clone is useless here.
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      # Must name this repository explicitly. A reusable workflow called from
      # another repository runs its steps in the CALLER's workspace, so a local
      # path ("uses: ./") would look for action.yml in the consumer's checkout.
      - name: Mirror
        uses: 2serenity/repo-mirror@v1
        with:
          branch: ${{ inputs.branch }}
          peer-url: ${{ inputs.peer-url }}
          ssh-key: ${{ secrets.ssh-key }}
          known-hosts: ${{ secrets.known-hosts }}
