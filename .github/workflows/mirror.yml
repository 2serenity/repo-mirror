name: Mirror repository

# Reusable workflow: fast-forward-only mirror of a branch to a peer over SSH.
# One installation only pushes; install it on both sides for a two-way mirror.
# Intended to be called from a consumer repository, e.g.
#
#   jobs:
#     mirror:
#       uses: 2serenity/repo-mirror/.github/workflows/mirror.yml@v1
#       with:
#         branch: dev
#         peer-url: ssh://git@example.com:22/group/project.git
#       secrets:
#         ssh-key: ${{ secrets.MIRROR_SSH_KEY }}
#         known-hosts: ${{ secrets.MIRROR_KNOWN_HOSTS }}
#
# mirror.sh is symmetric and can run from either side; PEER_AHEAD makes it step
# aside with exit 0. What that means depends on the topology:
#
#   one-way (this side only): nothing will deliver the peer's commits back, so
#     a direct push to the peer branch silently stops mirroring while every run
#     still reports success. The receiving branch MUST be protected and
#     writable only by this mirror's key.
#   two-way (installed on both sides): the peer's own mirror pushes those
#     commits here, so PEER_AHEAD is a handover rather than a stall. The price
#     is that independent commits on both sides end in DIVERGED (exit 20),
#     which is resolved by hand.
#
# See README.md, section "Topology".

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to mirror."
        required: true
        type: string
      peer-url:
        description: "SSH URL of the peer repository."
        required: true
        type: string
    secrets:
      ssh-key:
        description: "Private SSH key (deploy key)."
        required: true
      known-hosts:
        description: "known_hosts entry for the peer host."
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Two mirror runs must not race.
    concurrency:
      group: repository-mirror
      cancel-in-progress: false

    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # mirror.sh compares full branches; a shallow clone is useless here.
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      # Must name this repository explicitly. A reusable workflow called from
      # another repository runs its steps in the CALLER's workspace, so a local
      # path ("uses: ./") would look for action.yml in the consumer's checkout.
      - name: Mirror
        uses: 2serenity/repo-mirror@v1
        with:
          branch: ${{ inputs.branch }}
          peer-url: ${{ inputs.peer-url }}
          ssh-key: ${{ secrets.ssh-key }}
          known-hosts: ${{ secrets.known-hosts }}
