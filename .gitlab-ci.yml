# Pipeline for the repo-mirror component itself.
#
# validate runs everywhere (branches, MRs, tags) and is pure offline. release
# creates a GitLab Release on a bare semver tag; the CI/CD Catalog accepts the
# component only once such a release exists.

# Self-include: compiles the product on every commit without ever running it.
# validate.sh only inspects the generated file as data; this is the only check
# that makes GitLab itself parse spec: and every $[[ inputs.* ]]. A broken
# component fails pipeline creation here instead of at a consumer - which is
# exactly how 1.0.0 shipped unusable.
include:
  - local: templates/mirror.yml
    inputs:
      job_name: component-selftest
      branch: main
      peer_url: "ssh://git@example.invalid:22/g/p.git"
      rules:
        - when: never

variables:
  ALPINE_IMAGE: alpine:3.21

stages:
  - validate
  - test
  - release

.alpine:
  image: ${ALPINE_IMAGE}
  interruptible: true
  before_script:
    - apk add --no-cache yq curl

validate:offline:
  extends: .alpine
  stage: validate
  script:
    - sh ci/validate.sh

test:mirror:
  stage: test
  image: ${ALPINE_IMAGE}
  interruptible: true
  before_script:
    - apk add --no-cache git
  script:
    - sh ci/test-mirror.sh

release:
  stage: release
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - apk add --no-cache curl
    # Idempotent: a rerun on the same tag must not turn red on the API's 409.
    - |
      set -eu
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/${CI_COMMIT_TAG}")
      if [ "$CODE" = "200" ]; then
        echo "release ${CI_COMMIT_TAG} already exists; nothing to do"
        exit 0
      fi
      if [ "$CODE" != "404" ]; then
        echo "unexpected HTTP ${CODE} from the releases API" >&2
        exit 1
      fi
      curl --fail -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data "name=Release ${CI_COMMIT_TAG}" \
        --data "tag_name=${CI_COMMIT_TAG}" \
        --data "description=See CHANGELOG.md" \
        "${API}"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
