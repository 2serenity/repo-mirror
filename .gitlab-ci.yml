# Pipeline for the repo-mirror component itself.
#
# validate runs everywhere (branches, MRs, tags) and is pure offline. release
# creates a GitLab Release on a bare semver tag; the CI/CD Catalog accepts the
# component only once such a release exists.

variables:
  ALPINE_IMAGE: alpine:3.21

stages:
  - validate
  - release

.alpine:
  image: ${ALPINE_IMAGE}
  interruptible: true
  before_script:
    - apk add --no-cache jq yq curl

validate:offline:
  extends: .alpine
  stage: validate
  script:
    - sh ci/validate.sh

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  release:
    name: 'Release $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: 'See CHANGELOG.md'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
