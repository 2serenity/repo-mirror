# Pipeline for the repo-mirror component itself.
#
# validate runs everywhere (branches, MRs, tags) and is pure offline. release
# creates a GitLab Release on a bare semver tag; the CI/CD Catalog accepts the
# component only once such a release exists.

# Self-include: compiles the product on every commit without ever running it.
# validate.sh only inspects the generated file as data; this is the only check
# that makes GitLab itself parse spec: and every $[[ inputs.* ]]. A broken
# component fails pipeline creation here instead of at a consumer - which is
# exactly how 1.0.0 shipped unusable.
include:
  - local: templates/mirror.yml
    inputs:
      job_name: component-selftest
      branch: main
      peer_url: "ssh://git@example.invalid:22/g/p.git"
      rules:
        - when: never

  # The standalone artefact ships to peers on OTHER GitLab instances, which
  # cannot reference this catalog at all. Nothing else would ever parse it, so
  # it is compiled here too and then switched off by the override below.
  - local: templates/mirror-standalone.yml

  # The real installation: this project mirrors its own default branch to the
  # public GitHub copy with its own component. Possible only since the two
  # histories were unified (2026-08-28) - before that they shared no ancestor
  # and every run would have classified DIVERGED.
  #
  # It sits in `publish`, not the component's default `.pre`: a broken mirror.sh
  # must fail this pipeline, not travel to the copy consumers read. The job
  # pushes exactly one ref and never tags, so the pre-scrub ancestors still
  # reachable from tags 1.0.x on this side cannot leak into the public repo.
  - local: templates/mirror.yml
    inputs:
      job_name: mirror-github
      stage: publish
      branch: main
      peer_url: "ssh://git@github.com:22/2serenity/repo-mirror.git"

mirror:
  rules:
    - when: never

variables:
  ALPINE_IMAGE: alpine:3.21

stages:
  - validate
  - test
  - publish
  - release

.alpine:
  image: ${ALPINE_IMAGE}
  interruptible: true
  before_script:
    - apk add --no-cache yq curl

validate:offline:
  extends: .alpine
  stage: validate
  script:
    - sh ci/validate.sh

lint:actions:
  stage: validate
  # ci/validate.sh asserts YAML shape; it cannot tell a valid YAML file from a
  # valid workflow. actionlint can, and would have caught the missing
  # workflow_call `type:` the day it was written instead of six pushes later.
  #
  # Pinned by digest, not by tag: upstream publishes no immutable versioned tag,
  # and a linter that silently changes its rules is worse than no linter. The
  # image ships a shell, so GitLab's script wrapper works without an entrypoint
  # override.
  image: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  interruptible: true
  script:
    - actionlint -color

test:mirror:
  stage: test
  image: ${ALPINE_IMAGE}
  interruptible: true
  before_script:
    - apk add --no-cache git
  script:
    - sh ci/test-mirror.sh

release:
  stage: release
  # Only a release created by the release: keyword publishes the component to
  # the CI/CD Catalog - the Releases API does not, which is why 1.0.1 never
  # showed up there. GitLab 19.0 dropped the release-cli fallback, so the job
  # needs the glab CLI image; upstream pins it to :latest and offers no
  # versioned tag, so this is the one unpinned dependency in the pipeline.
  #
  # Not idempotent: rerunning a tag pipeline fails because the release already
  # exists. The keyword offers no skip, and catalog publishing outweighs it.
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "Publishing ${CI_COMMIT_TAG} to the CI/CD Catalog"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Release $CI_COMMIT_TAG
    description: See CHANGELOG.md

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
